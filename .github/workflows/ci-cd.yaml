name: CI/CD

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/dsl
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test-requirements.txt
            src/data-scratch-library/pyproject.toml

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r test-requirements.txt
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -e src/data-scratch-library

      - name: Run tests
        working-directory: src/data-scratch-library
        run: ../../.venv/bin/pytest --cov=dsl --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: src/data-scratch-library/coverage.xml
          if-no-files-found: error
          retention-days: 1

  build_image:
    name: Build and Validate Docker Image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image tarball
        run: |
          docker buildx build \
            --cache-from type=gha,scope=ci-cd-docker \
            --cache-to type=gha,mode=max,scope=ci-cd-docker \
            --file Dockerfile \
            --tag local/dsl:${{ github.sha }} \
            --output type=docker,dest=/tmp/dsl-image.tar \
            .

      - name: Load image from tarball
        run: |
          docker load --input /tmp/dsl-image.tar

      - name: Smoke test built image runtimes
        run: |
          docker run --rm local/dsl:${{ github.sha }} sh -c "python -c 'import dsl; print(\"python runtime: OK\")' && node --version && g++ --version"

      - name: Upload tested image artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsl-image-tar
          path: /tmp/dsl-image.tar
          if-no-files-found: error
          retention-days: 7

  sonarqube:
    name: SonarQube Scan and Quality Gate
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: python-coverage-report
          path: src/data-scratch-library

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar-

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.organization=wilsonify
            -Dsonar.python.coverage.reportPaths=src/data-scratch-library/coverage.xml

      - name: Enforce SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt

  publish:
    name: Publish Official Docker Image
    runs-on: ubuntu-latest
    needs: [build_image, sonarqube]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download tested image artifact
        uses: actions/download-artifact@v4
        with:
          name: dsl-image-tar
          path: /tmp

      - name: Load tested image
        run: |
          docker load --input /tmp/dsl-image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push official image
        run: |
          VERSION_TAG="${GITHUB_REF_NAME#v}"
          docker tag local/dsl:${{ github.sha }} $IMAGE_NAME:$VERSION_TAG
          docker tag local/dsl:${{ github.sha }} $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$VERSION_TAG
          docker push $IMAGE_NAME:latest
