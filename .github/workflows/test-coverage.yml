name: Test Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      working-directory: ./src/data-scratch-library
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov
        
    - name: Run tests with coverage
      working-directory: ./src/data-scratch-library
      run: |
        python -m pytest tests/ --cov=dsl --cov-report=term-missing --cov-report=html --cov-branch --cov-fail-under=90
        
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: src/data-scratch-library/htmlcov/
        
    - name: Coverage Summary
      working-directory: ./src/data-scratch-library
      if: always()
      run: |
        python -m pytest tests/ --cov=dsl --cov-report=term --cov-branch --cov-fail-under=90
