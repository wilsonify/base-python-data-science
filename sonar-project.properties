# SonarQube Project Configuration
sonar.projectKey=base-python-data-science
sonar.projectName=Base Python Data Science
sonar.projectVersion=1.0

# Source directories
sonar.sources=src

# Exclusions - do not analyze generated code, third-party libraries, or node_modules
sonar.exclusions=\
  **/node_modules/**,\
  **/generated/**,\
  **/external/**,\
  **/__pycache__/**,\
  **/*.egg-info/**,\
  **/build/**,\
  **/dist/**,\
  **/venv/**,\
  **/env/**,\
  **/.venv/**,\
  **/tests/build/**,\
  **/_deps/**,\
  **/vendor/**,\
  **/.tox/**,\
  **/.nox/**,\
  **/.pytest_cache/**,\
  **/coverage-reports/**,\
  **/.scannerwork/**

# Test exclusions
sonar.test.inclusions=\
  **/test_*.py,\
  **/*_test.py,\
  **/tests/**

# Coverage exclusions
sonar.coverage.exclusions=\
  **/tests/**,\
  **/test_*.py,\
  **/*_test.py

# Encoding
sonar.sourceEncoding=UTF-8

# Language specific settings
sonar.python.version=3.8,3.9,3.10,3.11,3.12
