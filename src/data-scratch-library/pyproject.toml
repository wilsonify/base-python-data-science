[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dsl"
version = "1.0.0"
description = "Data Science From Scratch"
keywords = ["datascience", "python"]

[project.urls]
homepage = "https://github.com/wilsonify/base-python-data-science"

[tool.setuptools.packages.find]
where = ["."]
include = ["dsl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--cov=dsl --cov-report=term-missing --cov-report=html --cov-branch --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["dsl"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/e01_*.py",
    "*/c01_intro/*",
    "*/c02_crash_course/*",
    "*/c07_hypothesis_and_inference/*",
    "*/c09_getting_data/*",
    "*/c10_working_with_data/*",
    "*/c19_deep_learning/e02_fizzbuzz_revisited.py",
    "*/c19_deep_learning/io.py",
    "*/c26_data_ethics/*",
    "*/c27_go_forth/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90

